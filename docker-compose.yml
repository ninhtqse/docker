version: "3.8"

networks:
  webphp:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.0.0/16
          gateway: 10.203.0.1

volumes:
    mysql-data:
    postgres-data:
    vendor:

services:
    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: d-nginx
        restart: always
        ports:
            - "81:80"
        volumes:
            - ./code/html:/var/www/html:ro
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./nginx/sites-enabled:/etc/nginx/sites-enabled
            - ./nginx/ssl:/etc/nginx/ssl
            - ./nginx/log:/var/log/nginx
        links:
            - php
            - mysql
        healthcheck:
            test: ["CMD", "service", "nginx", "status"]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            webphp:
                ipv4_address: 10.203.0.2
    php:
        build:
            context: ./php
            dockerfile: Dockerfile
        container_name: d-php
        restart: always
        user: www-data
        volumes:
            - ./code/html:/var/www/html:cached
            - ./php/crontab:/etc/cron.d/crontab
            # Improve
            - type: volume
              source: post-call-survey
              target: /var/www/html/example/vendor
        links:
            - mysql
            - redis
            - postgres
        healthcheck:
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 30s
        networks:
            webphp:
                ipv4_address: 10.203.0.3
    mysql:
        image: mysql:8.0
        container_name: d-mysql
        restart: unless-stopped
        command: [--default-authentication-plugin=mysql_native_password, --max-allowed-packet=10GB, --log_bin_trust_function_creators=1]
        ports:
            - '3309:3306'
        environment:
            MYSQL_DATABASE: sample
            MYSQL_ROOT_PASSWORD: Ka3%u6Ae
            MYSQL_USER: foo
            MYSQL_PASSWORD: hA*+BEAe
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./mysql:/docker-entrypoint-initdb.d:ro
            - ./mysql/my.cnf:/etc/mysql/conf.d/my_custom.cnf
            # Improve
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: mysqladmin ping
            interval: 3s
            timeout: 3s
            retries: 3
        networks:
            webphp:
                ipv4_address: 10.203.0.4
    redis:
        container_name: d-redis
        image: redis
        restart: always
        environment:
            - ALLOW_EMPTY_PASSWORD=yes
        ports:
            - '6379:6379'
        healthcheck:
            test: ["CMD", "redis-cli","ping"]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            webphp:
                ipv4_address: 10.203.0.5
    postgres:
        image: postgres:15
        container_name: d-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
            POSTGRES_DB: mydb
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            webphp:
                ipv4_address: 10.203.0.6